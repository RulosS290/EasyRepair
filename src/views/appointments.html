<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cita</title>
</head>
<body>
    <h2>Crear Cita</h2>
    <form id="appointmentForm">
        <label for="technician">Seleccionar Técnico:</label>
        <select id="technician" name="technician" required>
            <!-- Los técnicos serán cargados dinámicamente -->
        </select>
        <br><br>

        <label for="device">Seleccionar Dispositivo:</label>
        <select id="device" name="device" required>
            <optgroup label="Laptops">
                <option value="Laptop Dell XPS 13">Laptop Dell XPS 13</option>
                <option value="MacBook Pro 16">MacBook Pro 16</option>
                <option value="Asus ROG Zephyrus G14">Asus ROG Zephyrus G14</option>
                <option value="Lenovo ThinkPad X1 Carbon">Lenovo ThinkPad X1 Carbon</option>
            </optgroup>
            <optgroup label="Celulares">
                <option value="iPhone 13 Pro">iPhone 13 Pro</option>
                <option value="iPhone 15">iPhone 15</option>
                <option value="Samsung Galaxy S23">Samsung Galaxy S23</option>
                <option value="Google Pixel 8">Google Pixel 8</option>
                <option value="Xiaomi Mi 13">Xiaomi Mi 13</option>
            </optgroup>
            <optgroup label="Tablets">
                <option value="Tablet iPad Air">iPad Air</option>
                <option value="Samsung Galaxy Tab S9">Samsung Galaxy Tab S9</option>
                <option value="Microsoft Surface Pro 9">Microsoft Surface Pro 9</option>
            </optgroup>
            <optgroup label="Electrodomésticos">
                <option value="Televisor Samsung QLED 65">Televisor Samsung QLED 65"</option>
                <option value="Refrigerador LG Smart Inverter">Refrigerador LG Smart Inverter</option>
                <option value="Aspiradora iRobot Roomba">Aspiradora iRobot Roomba</option>
                <option value="Lavadora Whirlpool 20Kg">Lavadora Whirlpool 20Kg</option>
                <option value="Horno Microondas Panasonic">Horno Microondas Panasonic</option>
            </optgroup>
        </select>
        <br><br>
        
        <label for="datetime">Horario disponible del técnico:</label>
        <select id="datetime" name="datetime" required>
            <option value="2024-03-11T08:00">08:00 AM</option>
            <option value="2024-03-11T10:00">10:00 AM</option>
            <option value="2024-03-11T12:00">12:00 PM</option>
            <option value="2024-03-11T14:00">02:00 PM</option>
            <option value="2024-03-11T16:00">04:00 PM</option>
        </select>
        <br><br>

        <button type="submit">Crear Cita</button>
    </form>

    <script>
        const loadTechnicians = async () => {
            try {
                const response = await fetch('/api/appointmentsGetTechnicians', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}` 
                    }
                });

                const technicians = await response.json();

                if (technicians.error) {
                    console.error('Error al obtener técnicos:', technicians.error);
                    alert(technicians.error);  
                    return;
                }

                if (Array.isArray(technicians)) {
                    const technicianSelect = document.getElementById('technician');
                    technicians.forEach(technician => {
                        const option = document.createElement('option');
                        option.value = technician.id; 
                        option.textContent = `ID: ${technician.id} - ${technician.username}`; 
                        technicianSelect.appendChild(option);
                    });
                } else {
                    console.error('Respuesta inesperada:', technicians);
                    alert('No se pudo cargar la lista de técnicos correctamente.');
                }
            } catch (error) {
                console.error('Error al cargar los técnicos:', error);
                alert('No se pudo cargar la lista de técnicos.');
            }
        };

        window.onload = loadTechnicians;

        document.getElementById('appointmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
        
            let technicianId = document.getElementById('technician').value;
            const device = document.getElementById('device').value;
            const datetime = document.getElementById('datetime').value;
        
            technicianId = parseInt(technicianId, 10);
            if (isNaN(technicianId)) {
                alert('El ID del técnico debe ser un número válido.');
                return;
            }
        
            const token = localStorage.getItem('token');
    
            const response = await fetch('/api/appointments', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    technicianId,
                    device,
                    datetime
                })
            });
        
            const data = await response.json();
        
            if (response.ok) {
                alert('Cita creada con éxito.');
                window.location.href = '/appointments';  
            } else {
                alert(data.error || 'Error al crear la cita');
            }
        });        
    </script>
</body>
</html>
