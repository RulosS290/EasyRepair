version: '3.8'

services:
  backend:
    build: .
    container_name: easyrepair_backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - cloudsql-proxy
    env_file:
      - .env
    environment:
      - PORT=${PORT}
      - SECRET_KEY=${SECRET_KEY}
      - INSTANCE_HOST=cloudsql-proxy
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    command: ["npm", "start"]

  cloudsql-proxy:
    image: gcr.io/cloudsql-docker/gce-proxy:latest
    container_name: easyrepair_proxy
    restart: always
    command: [
      "/cloud_sql_proxy",
      "-instances=${INSTANCE_CONNECTION_NAME}=tcp:0.0.0.0:3306",
      "-credential_file=/config/bustling-brand-451923-r7-aa4aeae7036b.json"
    ]
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - "./src/config:/config"
